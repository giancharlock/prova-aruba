spring:
  kafka:
    bootstrap-servers: kafka:9092

eureka:
  client:
    serviceUrl:
      defaultZone: http://eurekaserver:8761/eureka/

logging:
  level:
    com.experis.scheduler: DEBUG
    org.apache.kafka: WARN

app:
  scheduler:
    dbmanager-url: "http://dbmanager:9020/api"
    dlt-report-path: "/reports/dlt_report.csv"
    invoice-report-path: "/reports/invoice_status_report.csv"
